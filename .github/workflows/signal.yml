name: Run Gold Trading Signal Bot

on:
  schedule:
    # Runs every 15 minutes, Monday through Friday only (stops on Sat & Sun)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
    # Allows you to trigger the script manually from the GitHub website anytime

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Removed cache to prevent missing file errors

      - name: Install dependencies
        run: |
          python -ms pip install --upgrade pip
          pip install requests pandas

      - name: Run script
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Handles runner engine compatibility warnings safely
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: python bot.py
