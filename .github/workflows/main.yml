name: Biweekly Telegram Consistency Message

on:
  schedule:
    # Runs at 04:00 UTC every Monday to Friday
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Check if this is a posting week
        id: week
        run: |
          WEEK=$(date +%V)
          if [ $((10#$WEEK % 2)) -eq 0 ]; then
            echo "post=true" >> $GITHUB_OUTPUT
          else
            echo "post=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.week.outputs.post == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.week.outputs.post == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.week.outputs.post == 'true'
        run: pip install requests

      - name: Run script
        if: steps.week.outputs.post == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python en.py
