name: Update news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-feed-update
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RSS parser
        run: python -m pip install --disable-pip-version-check feedparser Pillow
      - name: Collect configured RSS sources
        run: python scripts/fetch_news.py
      - name: Commit updated feeds
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds
          git diff --staged --quiet || (git commit -m "Update aggregated news feeds" && git push)
