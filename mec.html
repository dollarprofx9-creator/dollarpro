<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade or Stay Off</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: #050505;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 580px;
  background: #0f0f0f;
  border: 1px solid #1f1f1f;
  border-radius: 24px;
  padding: 48px 32px;
  box-shadow: 0 0 0 1px rgba(0,212,255,0.05), 0 25px 70px rgba(0,0,0,0.7);
  text-align: center;
}
.title {
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.accent-line {
  width: 50px;
  height: 3px;
  background: #00d4ff;
  margin: 0 auto 28px;
  border-radius: 3px;
  box-shadow: 0 0 12px rgba(0,212,255,0.5);
}
.date-display {
  color: #777;
  font-size: 0.9rem;
  margin-bottom: 36px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.display-box {
  background: #080808;
  border: 1px solid #1a1a1a;
  border-radius: 20px;
  padding: 48px 24px;
  margin-bottom: 36px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.status-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: #555;
  font-weight: 700;
}
.result-display {
  font-size: clamp(2.8rem, 9vw, 5.5rem);
  font-weight: 900;
  line-height: 1;
  transition: color 0.05s linear;
}
.result-trade {
  color: #00e676;
  animation: greenGlow 2.5s ease-in-out infinite alternate;
}
.result-stayoff {
  color: #ff5252;
  animation: redGlow 2.5s ease-in-out infinite alternate;
}
.result-neutral {
  color: #333;
}
@keyframes greenGlow {
  0% { text-shadow: 0 0 10px rgba(0,230,118,0.2); }
  100% { text-shadow: 0 0 30px rgba(0,230,118,0.6), 0 0 70px rgba(0,230,118,0.3); }
}
@keyframes redGlow {
  0% { text-shadow: 0 0 10px rgba(255,82,82,0.2); }
  100% { text-shadow: 0 0 30px rgba(255,82,82,0.6), 0 0 70px rgba(255,82,82,0.3); }
}
.btn-group {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  flex: 1 1 140px;
  padding: 18px 28px;
  border: none;
  border-radius: 14px;
  font-size: 1.05rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.25s ease;
  outline: none;
  position: relative;
}
.btn-start {
  background: #00d4ff;
  color: #000;
  box-shadow: 0 4px 20px rgba(0,212,255,0.25);
}
.btn-start:hover:not(:disabled) {
  background: #4ce0ff;
  box-shadow: 0 6px 30px rgba(0,212,255,0.45);
  transform: translateY(-2px);
}
.btn-pause {
  background: #1c1c1c;
  color: #eee;
  border: 1px solid #333;
}
.btn-pause:hover:not(:disabled) {
  background: #2a2a2a;
  border-color: #555;
  transform: translateY(-2px);
}
.btn-reset {
  background: transparent;
  color: #555;
  border: 1px solid #2a2a2a;
}
.btn-reset:hover {
  color: #999;
  border-color: #555;
  background: #111;
  transform: translateY(-2px);
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none;
}
@media (max-width: 480px) {
  .container { padding: 36px 20px; }
  .display-box { padding: 36px 16px; min-height: 180px; }
  .btn { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">Trade or Stay Off</h1>
  <div class="accent-line"></div>
  <div class="date-display" id="dateDisplay"></div>
  
  <div class="display-box">
    <div class="status-label" id="statusLabel">No decision selected yet</div>
    <div class="result-display result-neutral" id="resultDisplay">—</div>
  </div>
  
  <div class="btn-group">
    <button class="btn btn-start" id="startBtn">Start</button>
    <button class="btn btn-pause" id="pauseBtn" disabled>Pause</button>
    <button class="btn btn-reset" id="resetBtn">Reset</button>
  </div>
</div>

<script>
(function() {
  const dateDisplay = document.getElementById('dateDisplay');
  const statusLabel = document.getElementById('statusLabel');
  const resultDisplay = document.getElementById('resultDisplay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const STORAGE_KEY = 'tradeOrStayOff_today';
  const outcomes = [
    { text: 'TRADE', type: 'TRADE', className: 'result-trade' },
    { text: 'STAY OFF', type: 'STAY_OFF', className: 'result-stayoff' }
  ];

  let isAnimating = false;
  let intervalId = null;

  function getTodayStr() {
    return new Date().toISOString().split('T')[0];
  }

  function showDate() {
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    dateDisplay.textContent = new Date().toLocaleDateString('en-US', opts);
  }

  function renderOutcome(outcome, final) {
    resultDisplay.textContent = outcome.text;
    resultDisplay.className = 'result-display ' + outcome.className;
    if (final) {
      statusLabel.textContent = "Today's Decision";
    } else {
      statusLabel.textContent = 'Selecting...';
    }
  }

  function renderNeutral() {
    resultDisplay.textContent = '—';
    resultDisplay.className = 'result-display result-neutral';
    resultDisplay.style.color = '';
    resultDisplay.style.textShadow = '';
    statusLabel.textContent = 'No decision selected yet';
  }

  function saveDecision(type) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: getTodayStr(), type: type }));
    } catch (e) {}
  }

  function loadDecision() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data.date === getTodayStr()) {
        const o = outcomes.find(x => x.type === data.type);
        if (o) { renderOutcome(o, true); return true; }
      }
    } catch (e) {}
    return false;
  }

  function clearDecision() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function startAnimation() {
    if (isAnimating) return;
    isAnimating = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    resultDisplay.className = 'result-display';
    resultDisplay.style.textShadow = 'none';

    intervalId = setInterval(() => {
      const o = outcomes[Math.floor(Math.random() * outcomes.length)];
      resultDisplay.textContent = o.text;
      resultDisplay.style.color = o.type === 'TRADE' ? '#00e676' : '#ff5252';
      statusLabel.textContent = 'Selecting...';
    }, 70);
  }

  function pauseAnimation() {
    if (!isAnimating) return;
    clearInterval(intervalId);
    isAnimating = false;
    startBtn.disabled = false;
    pauseBtn.disabled = true;

    const currentText = resultDisplay.textContent;
    let outcome = outcomes.find(o => o.text === currentText);
    if (!outcome) {
      outcome = outcomes[Math.floor(Math.random() * outcomes.length)];
    }

    resultDisplay.style.color = '';
    resultDisplay.style.textShadow = '';
    renderOutcome(outcome, true);
    saveDecision(outcome.type);
  }

  function resetAll() {
    if (isAnimating) {
      clearInterval(intervalId);
      isAnimating = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }
    clearDecision();
    renderNeutral();
  }

  startBtn.addEventListener('click', startAnimation);
  pauseBtn.addEventListener('click', pauseAnimation);
  resetBtn.addEventListener('click', resetAll);

  showDate();
  if (!loadDecision()) {
    renderNeutral();
    pauseBtn.disabled = true;
  } else {
    pauseBtn.disabled = true;
  }
})();
</script>
</body>
</html>
