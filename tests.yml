name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_world
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_world"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/ai_world pytest -q
