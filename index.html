<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Trading Time Picker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.6), 0 0 40px rgba(0, 100, 255, 0.3);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8899aa;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .clock-panel {
            background: linear-gradient(145deg, #0a0a1a 0%, #0d0d1f 50%, #080818 100%);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.08), inset 0 0 60px rgba(0, 50, 150, 0.05);
            position: relative;
        }

        .clock-panel::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.3), transparent 40%, transparent 60%, rgba(0, 150, 255, 0.3));
            z-index: -1;
        }

        .clock-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
        }

        @media (min-width: 480px) {
            .clock-wrapper {
                width: 340px;
                height: 340px;
            }
        }

        .clock-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #0f0f2a 0%, #080818 70%, #050510 100%);
            border: 2px solid rgba(0, 150, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.1), inset 0 0 50px rgba(0, 50, 150, 0.08);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #00aaff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.8), 0 0 30px rgba(0, 170, 255, 0.4);
            z-index: 10;
        }

        .clock-number {
            position: absolute;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #8899aa;
            border-radius: 50%;
            transition: all 0.15s ease;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            left: 50%;
            top: 50%;
            margin-left: -20px;
            margin-top: -20px;
        }

        .clock-number.active {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 200, 255, 1), 0 0 30px rgba(0, 150, 255, 0.8);
            transform: scale(1.3);
            z-index: 5;
        }

        .clock-number.selected {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 200, 255, 1), 0 0 40px rgba(0, 150, 255, 0.9), 0 0 60px rgba(0, 100, 255, 0.6);
            transform: scale(1.4);
            z-index: 5;
        }

        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 110px;
            background: linear-gradient(to top, transparent 0%, transparent 20%, #00aaff 20%, #00ddff 100%);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(-90deg);
            border-radius: 2px;
            transition: transform 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 8;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.6);
        }

        @media (min-width: 480px) {
            .pointer {
                height: 135px;
            }
        }

        .pointer::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #00ddff;
            filter: drop-shadow(0 0 6px rgba(0, 200, 255, 0.8));
        }

        .pointer.spinning {
            transition: transform 0.08s linear;
        }

        .am-pm-selector {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .am-pm-btn {
            padding: 10px 28px;
            border: 1px solid rgba(0, 150, 255, 0.3);
            background: rgba(0, 20, 60, 0.4);
            color: #8899aa;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .am-pm-btn:hover {
            border-color: rgba(0, 150, 255, 0.6);
            color: #aaccff;
            background: rgba(0, 30, 80, 0.5);
        }

        .am-pm-btn.active {
            background: linear-gradient(135deg, #0066cc 0%, #0088ff 100%);
            color: #ffffff;
            border-color: #00aaff;
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.4), 0 0 40px rgba(0, 100, 255, 0.2);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 14px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 130px;
            position: relative;
            overflow: hidden;
        }

        .btn-start {
            background: linear-gradient(135deg, #0066cc 0%, #0088ff 50%, #00aaff 100%);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.3), 0 4px 15px rgba(0, 100, 255, 0.2);
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.5), 0 6px 20px rgba(0, 100, 255, 0.3);
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-pause {
            background: linear-gradient(135deg, #004488 0%, #0066cc 100%);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 100, 200, 0.3);
        }

        .btn-pause:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 136, 255, 0.5);
        }

        .btn-pause:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-reset {
            background: linear-gradient(135deg, #1a1a2e 0%, #252540 100%);
            color: #aaccff;
            border: 1px solid rgba(0, 150, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 100, 255, 0.1);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 150, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.2);
            color: #ffffff;
        }

        .result-panel {
            background: linear-gradient(145deg, #0a0a1a 0%, #0d0d1f 100%);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.08);
        }

        .result-panel.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .result-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
            animation: bounceIn 0.6s ease;
        }

        .result-label {
            font-size: 0.85rem;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-time {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.8), 0 0 40px rgba(0, 150, 255, 0.5), 0 0 80px rgba(0, 100, 255, 0.3);
            letter-spacing: 2px;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .result-note {
            font-size: 0.8rem;
            color: #667788;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .ring-markers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .ring-marker {
            position: absolute;
            width: 3px;
            height: 8px;
            background: rgba(0, 150, 255, 0.2);
            border-radius: 2px;
            left: 50%;
            top: 8px;
            transform-origin: center 132px;
            margin-left: -1.5px;
        }

        @media (min-width: 480px) {
            .ring-marker {
                transform-origin: center 162px;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 200, 255, 0.8), 0 0 40px rgba(0, 150, 255, 0.5), 0 0 80px rgba(0, 100, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(0, 220, 255, 1), 0 0 60px rgba(0, 170, 255, 0.7), 0 0 100px rgba(0, 120, 255, 0.5);
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status-text {
            font-size: 0.75rem;
            color: #556677;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            min-height: 18px;
        }

        .status-text.spinning {
            color: #00aaff;
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
            animation: blink 0.5s ease-in-out infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .outer-glow {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 150, 255, 0.08);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="title">Magic Trading Time Picker</div>
            <div class="subtitle">Random Hour Selector</div>
        </div>

        <div class="clock-panel">
            <div class="am-pm-selector">
                <button class="am-pm-btn active" id="btnAM" onclick="setPeriod('AM')">AM</button>
                <button class="am-pm-btn" id="btnPM" onclick="setPeriod('PM')">PM</button>
            </div>

            <div class="clock-wrapper" id="clockWrapper">
                <div class="outer-glow"></div>
                <div class="clock-face">
                    <div class="ring-markers" id="ringMarkers"></div>
                    <div id="numbersContainer"></div>
                </div>
                <div class="pointer" id="pointer"></div>
            </div>

            <div class="status-text" id="statusText">Ready to spin</div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="startSpin()">Start</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pauseSpin()" disabled>Pause</button>
            <button class="btn btn-reset" id="resetBtn" onclick="resetAll()">Reset</button>
        </div>

        <div class="result-panel" id="resultPanel">
            <span class="result-icon">🎯</span>
            <div class="result-label">Your Selected Time</div>
            <div class="result-time" id="resultTime">--:--</div>
            <div class="result-note">Trading Time Chosen Randomly</div>
        </div>
    </div>

    <script>
        let currentPeriod = 'AM';
        let isSpinning = false;
        let spinInterval = null;
        let currentHour = 12;
        let selectedHour = null;

        const numbersContainer = document.getElementById('numbersContainer');
        const pointer = document.getElementById('pointer');
        const ringMarkers = document.getElementById('ringMarkers');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultPanel = document.getElementById('resultPanel');
        const resultTime = document.getElementById('resultTime');
        const statusText = document.getElementById('statusText');
        const btnAM = document.getElementById('btnAM');
        const btnPM = document.getElementById('btnPM');

        function initClock() {
            // Create ring markers
            for (let i = 0; i < 60; i++) {
                const marker = document.createElement('div');
                marker.className = 'ring-marker';
                marker.style.transform = `rotate(${i * 6}deg)`;
                if (i % 5 === 0) {
                    marker.style.height = '12px';
                    marker.style.background = 'rgba(0, 150, 255, 0.35)';
                    marker.style.width = '4px';
                    marker.style.marginLeft = '-2px';
                }
                ringMarkers.appendChild(marker);
            }

            // Create numbers 1-12
            for (let h = 1; h <= 12; h++) {
                const numEl = document.createElement('div');
                numEl.className = 'clock-number';
                numEl.id = `num-${h}`;
                numEl.textContent = h;

                const angle = (h * 30) - 90;
                const radius = 105;
                const rad = angle * Math.PI / 180;
                const x = Math.cos(rad) * radius;
                const y = Math.sin(rad) * radius;

                numEl.style.transform = `translate(${x}px, ${y}px)`;
                numbersContainer.appendChild(numEl);
            }

            // Set initial pointer to 12
            updatePointer(12);
            highlightNumber(12);
        }

        function updatePointer(hour) {
            const angle = (hour * 30) - 90;
            pointer.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
        }

        function highlightNumber(hour) {
            document.querySelectorAll('.clock-number').forEach(el => {
                el.classList.remove('active', 'selected');
            });
            const activeNum = document.getElementById(`num-${hour}`);
            if (activeNum) {
                if (isSpinning) {
                    activeNum.classList.add('active');
                } else if (selectedHour !== null) {
                    activeNum.classList.add('selected');
                }
            }
        }

        function setPeriod(period) {
            if (isSpinning) return;
            currentPeriod = period;
            if (period === 'AM') {
                btnAM.classList.add('active');
                btnPM.classList.remove('active');
            } else {
                btnPM.classList.add('active');
                btnAM.classList.remove('active');
            }
        }

        function getRandomHour() {
            return Math.floor(Math.random() * 12) + 1;
        }

        function startSpin() {
            if (isSpinning) return;

            isSpinning = true;
            selectedHour = null;
            resultPanel.classList.remove('show');
            pointer.classList.add('spinning');

            startBtn.disabled = true;
            pauseBtn.disabled = false;
            btnAM.disabled = true;
            btnPM.disabled = true;
            btnAM.style.opacity = '0.5';
            btnPM.style.opacity = '0.5';
            statusText.textContent = 'Selecting random hour...';
            statusText.classList.add('spinning');

            // Clear any selected state
            document.querySelectorAll('.clock-number').forEach(el => {
                el.classList.remove('selected');
            });

            let speed = 80;
            let lastHour = currentHour;

            spinInterval = setInterval(() => {
                let newHour;
                do {
                    newHour = getRandomHour();
                } while (newHour === lastHour);

                lastHour = newHour;
                currentHour = newHour;
                updatePointer(currentHour);
                highlightNumber(currentHour);
            }, speed);
        }

        function pauseSpin() {
            if (!isSpinning) return;

            clearInterval(spinInterval);
            isSpinning = false;
            pointer.classList.remove('spinning');

            selectedHour = currentHour;

            startBtn.disabled = false;
            pauseBtn.disabled = true;
            btnAM.disabled = false;
            btnPM.disabled = false;
            btnAM.style.opacity = '1';
            btnPM.style.opacity = '1';
            statusText.textContent = 'Time selected!';
            statusText.classList.remove('spinning');

            highlightNumber(selectedHour);

            // Display result
            const displayHour = selectedHour;
            const timeString = `${displayHour}:00 ${currentPeriod}`;
            resultTime.textContent = timeString;
            resultPanel.classList.add('show');
        }

        function resetAll() {
            clearInterval(spinInterval);
            isSpinning = false;
            pointer.classList.remove('spinning');

            selectedHour = null;
            currentHour = 12;

            startBtn.disabled = false;
            pauseBtn.disabled = true;
            btnAM.disabled = false;
            btnPM.disabled = false;
            btnAM.style.opacity = '1';
            btnPM.style.opacity = '1';

            statusText.textContent = 'Ready to spin';
            statusText.classList.remove('spinning');

            resultPanel.classList.remove('show');

            updatePointer(12);
            document.querySelectorAll('.clock-number').forEach(el => {
                el.classList.remove('active', 'selected');
            });
        }

        // Initialize on load
        initClock();
    </script>
</body>
</html>
